services:
  app:
    image: ghcr.io/shba007/portfolio-monalisa:latest@sha256:660404f7777d5cfcb3df7c7ea28f1fb58356e80eec86aece6eeef290b8931d9a
    env_file:
      - .env
    volumes:
      - portfolio-monalisa_static:/app/static
      - portfolio-monalisa_data:/app/.data
    networks:
      - internal
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        max_attempts: 3

volumes:
  portfolio-monalisa_static:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /root/portfolio-monalisa/static
  portfolio-monalisa_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /root/portfolio-monalisa/.data

networks:
  internal:
    driver: overlay
